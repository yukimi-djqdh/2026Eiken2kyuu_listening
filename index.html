<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>英検S-CBT体験版 2級 リスニングテスト（2026年度第2回）</title>
<style>
  :root {
    --primary-navy: #1b365d;
    --primary-blue: #005bac;
    --accent-orange: #e86c00;
    --bg-gray: #eef1f5;
    --border-color: #c5cdd6;
    --text-main: #222222;
    --selected-bg: #dcebff;
    --selected-border: #005bac;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    font-family: "Meiryo", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    background-color: var(--bg-gray);
    color: var(--text-main);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  header {
    background: linear-gradient(180deg, #234678 0%, #173156 100%);
    color: #ffffff;
    padding: 8px 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 3px solid #d97706;
    flex-shrink: 0;
  }

  .header-left {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .badge-grade {
    background-color: #ffffff;
    color: var(--primary-navy);
    font-weight: bold;
    padding: 3px 10px;
    border-radius: 4px;
    font-size: 14px;
  }

  .header-title {
    font-size: 16px;
    font-weight: bold;
    letter-spacing: 0.5px;
  }

  .header-right {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 13px;
  }

  .status-pill {
    background: rgba(255, 255, 255, 0.15);
    padding: 4px 10px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .btn-header {
    background-color: #d9534f;
    color: white;
    border: none;
    padding: 6px 14px;
    border-radius: 4px;
    font-weight: bold;
    cursor: pointer;
    font-size: 13px;
  }
  .btn-header:hover {
    background-color: #c9302c;
  }

  .main-container {
    display: flex;
    flex: 1;
    overflow: hidden;
  }

  .question-area {
    flex: 1;
    background-color: #ffffff;
    margin: 10px;
    border: 1px solid var(--border-color);
    border-radius: 6px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .part-banner {
    background-color: #f4f7fa;
    border-bottom: 1px solid var(--border-color);
    padding: 10px 18px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
  }

  .part-title {
    font-weight: bold;
    color: var(--primary-navy);
    font-size: 15px;
  }

  .audio-status-bar {
    display: flex;
    align-items: center;
    gap: 10px;
    background: #eef4fb;
    border: 1px solid #b8d0eb;
    padding: 5px 12px;
    border-radius: 20px;
    font-size: 13px;
    color: #004085;
  }

  .audio-wave {
    display: inline-flex;
    align-items: center;
    gap: 2px;
    height: 14px;
  }
  .audio-wave span {
    display: block;
    width: 3px;
    height: 6px;
    background-color: #005bac;
    animation: wave 0.8s infinite ease-in-out;
  }
  .audio-wave span:nth-child(2) { animation-delay: 0.2s; }
  .audio-wave span:nth-child(3) { animation-delay: 0.4s; }
  .audio-wave.paused span {
    animation: none;
    height: 4px;
    background-color: #888;
  }

  @keyframes wave {
    0%, 100% { height: 4px; }
    50% { height: 14px; }
  }

  .question-body {
    flex: 1;
    padding: 20px 28px;
    overflow-y: auto;
  }

  .q-number-heading {
    font-size: 20px;
    font-weight: bold;
    color: var(--primary-navy);
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .timer-badge {
    font-size: 14px;
    background-color: #fff3cd;
    color: #856404;
    border: 1px solid #ffeeba;
    padding: 3px 10px;
    border-radius: 4px;
    font-weight: bold;
  }
  .timer-badge.urgent {
    background-color: #f8d7da;
    color: #721c24;
    border-color: #f5c6cb;
  }

  .q-instruction {
    font-size: 13px;
    color: #555;
    margin-bottom: 18px;
  }

  .guidance-box {
    background-color: #f8fafc;
    border: 1px solid #cbd5e1;
    border-left: 5px solid var(--primary-blue);
    border-radius: 6px;
    padding: 18px 20px;
    max-width: 720px;
    line-height: 1.75;
    font-size: 15px;
  }

  .choices-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
    max-width: 720px;
  }

  .choice-item {
    display: flex;
    align-items: center;
    padding: 13px 16px;
    border: 2px solid #d0d7de;
    border-radius: 6px;
    cursor: pointer;
    background-color: #ffffff;
    transition: all 0.12s ease;
    font-size: 16px;
  }

  .choice-item:hover {
    background-color: #f6f9fc;
    border-color: #8cb4e0;
  }

  .choice-item.selected {
    background-color: var(--selected-bg);
    border-color: var(--selected-border);
    font-weight: bold;
  }

  .choice-num {
    display: inline-flex;
    justify-content: center;
    align-items: center;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    border: 1.5px solid #666;
    margin-right: 14px;
    font-weight: bold;
    font-size: 14px;
    flex-shrink: 0;
    background-color: #fff;
  }

  .choice-item.selected .choice-num {
    background-color: var(--selected-border);
    color: #ffffff;
    border-color: var(--selected-border);
  }

  .audio-debug-bar {
    margin-top: 20px;
    padding: 8px 12px;
    background: #f1f5f9;
    border: 1px solid #cbd5e1;
    border-radius: 6px;
    max-width: 720px;
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 12.5px;
    color: #334155;
  }
  .audio-debug-bar audio {
    height: 30px;
    flex: 1;
  }

  .question-footer {
    border-top: 1px solid var(--border-color);
    background-color: #f8f9fa;
    padding: 10px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
  }

  .nav-buttons {
    display: flex;
    gap: 10px;
  }

  .btn-nav {
    background-color: #ffffff;
    border: 1px solid #99a3ad;
    color: #222;
    padding: 7px 16px;
    border-radius: 4px;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
  }
  .btn-nav:hover:not(:disabled) {
    background-color: #e9ecef;
  }
  .btn-nav:disabled {
    opacity: 0.45;
    cursor: not-allowed;
  }

  .btn-primary {
    background-color: var(--primary-blue);
    color: #ffffff;
    border: none;
    padding: 7px 18px;
    border-radius: 4px;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
  }
  .btn-primary:hover {
    background-color: #004482;
  }

  .answer-panel {
    width: 260px;
    background-color: #ffffff;
    margin: 10px 10px 10px 0;
    border: 1px solid var(--border-color);
    border-radius: 6px;
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
  }

  .panel-header {
    background-color: #234678;
    color: #ffffff;
    font-weight: bold;
    font-size: 14px;
    padding: 9px 12px;
    text-align: center;
    border-radius: 5px 5px 0 0;
  }

  .panel-body {
    padding: 10px;
    overflow-y: auto;
    flex: 1;
  }

  .panel-part-label {
    font-size: 12px;
    font-weight: bold;
    color: #444;
    margin: 6px 0 6px 2px;
    border-bottom: 1px solid #ddd;
    padding-bottom: 2px;
  }

  .q-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 5px;
    margin-bottom: 12px;
  }

  .q-grid-item {
    border: 1px solid #bcc5d0;
    border-radius: 4px;
    font-size: 12px;
    text-align: center;
    cursor: pointer;
    background-color: #f9fafb;
    display: flex;
    justify-content: space-between;
    padding: 5px 7px;
  }

  .q-grid-item:hover {
    background-color: #eef4fb;
  }

  .q-grid-item.active {
    border: 2px solid var(--accent-orange);
    background-color: #fff8f0;
    font-weight: bold;
  }

  .q-grid-item.answered {
    background-color: #e3f0ff;
  }

  .ans-val {
    font-weight: bold;
    color: var(--primary-blue);
  }

  .overlay-screen {
    position: fixed;
    inset: 0;
    background-color: rgba(15, 30, 50, 0.85);
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 1000;
    padding: 16px;
  }

  .modal-card {
    background-color: #ffffff;
    max-width: 680px;
    width: 100%;
    border-radius: 8px;
    padding: 24px 28px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
    max-height: 92vh;
    overflow-y: auto;
  }

  .modal-card h2 {
    color: var(--primary-navy);
    font-size: 20px;
    border-bottom: 2px solid var(--primary-navy);
    padding-bottom: 8px;
    margin-bottom: 14px;
  }

  .modal-card p, .modal-card li {
    font-size: 14px;
    line-height: 1.6;
    margin-bottom: 8px;
  }

  .audio-setup-box {
    background-color: #f4f7fa;
    border: 1px solid #c5d3e3;
    border-radius: 6px;
    padding: 14px;
    margin: 14px 0;
  }

  .audio-setup-box h3 {
    font-size: 14px;
    color: var(--primary-navy);
    margin-bottom: 8px;
  }

  .auto-detect-status {
    font-size: 13px;
    padding: 8px 10px;
    border-radius: 4px;
    margin-bottom: 10px;
    background-color: #dcfce7;
    color: #166534;
    border: 1px solid #86efac;
  }

  .file-row {
    display: flex;
    flex-direction: column;
    gap: 4px;
    margin-bottom: 10px;
    font-size: 13px;
  }

  .mode-options {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-top: 10px;
    font-size: 13.5px;
  }

  .btn-start {
    display: block;
    width: 100%;
    background-color: var(--accent-orange);
    color: #ffffff;
    border: none;
    padding: 13px;
    font-size: 17px;
    font-weight: bold;
    border-radius: 6px;
    cursor: pointer;
    margin-top: 16px;
  }
  .btn-start:hover {
    background-color: #cf5f00;
  }

  .result-summary {
    background: #eef4fb;
    border: 1px solid #b8d0eb;
    padding: 16px;
    border-radius: 6px;
    text-align: center;
    margin-bottom: 18px;
  }
  .score-big {
    font-size: 32px;
    font-weight: bold;
    color: var(--primary-navy);
  }
  .review-item {
    border: 1px solid #d0d7de;
    border-radius: 6px;
    padding: 12px 14px;
    margin-bottom: 12px;
    font-size: 13.5px;
  }
  .review-item.correct { border-left: 5px solid #28a745; }
  .review-item.wrong { border-left: 5px solid #dc3545; }
  .script-box {
    background-color: #f8f9fa;
    padding: 10px;
    border-radius: 4px;
    margin-top: 8px;
    white-space: pre-line;
    font-family: sans-serif;
    line-height: 1.55;
    color: #333;
  }

  @media (max-width: 820px) {
    body {
      height: auto;
      min-height: 100vh;
      overflow-y: auto;
    }
    .main-container {
      flex-direction: column;
      overflow: visible;
    }
    .question-area {
      margin: 8px;
    }
    .answer-panel {
      width: auto;
      margin: 0 8px 16px 8px;
    }
    .q-grid {
      grid-template-columns: repeat(5, 1fr);
    }
  }
</style>
</head>
<body>

<div id="startScreen" class="overlay-screen">
  <div class="modal-card">
    <h2>英検S-CBT体験版 2級 リスニングテスト（2026年度第2回）</h2>
    <p>このテストには、<strong>第1部（No.1〜No.15）</strong>と<strong>第2部（No.16〜No.30）</strong>があります。英文と質問はそれぞれ<strong>1度だけ</strong>読まれ、質問のあと<strong>10秒の解答時間</strong>が経過すると自動的に次の問題へ進みます。</p>

    <div class="audio-setup-box">
      <h3>🔊 公式音声・再生設定</h3>
      <div id="autoDetectStatus" class="auto-detect-status">
        ✓ 準備完了：下のオレンジ色のボタンを押すと音声が再生されます（part1.mp3 / part2.mp3 を自動読み込みします）。
      </div>

      <details id="manualFileDetails">
        <summary style="cursor:pointer; font-size:13px; color:#005bac; margin-bottom:8px;">手元の音声ファイルを手動で選択する場合はこちら</summary>
        <div class="file-row">
          <label><strong>第1部 音声ファイル（No.1〜No.15）：</strong></label>
          <input type="file" id="audioFilePart1" accept="audio/*">
        </div>
        <div class="file-row">
          <label><strong>第2部 音声ファイル（No.16〜No.30）：</strong></label>
          <input type="file" id="audioFilePart2" accept="audio/*">
        </div>
      </details>

      <div class="mode-options">
        <label><input type="checkbox" id="skipIntroCheck"> 冒頭の日本語ガイダンスをスキップしてNo.1からすぐ開始する</label>
        <label><input type="checkbox" id="practiceModeCheck"> 練習モード（自動進行せず「頭出し再生」「次へ」を手動操作）</label>
      </div>
    </div>

    <button class="btn-start" onclick="startTest()">リスニングテストを開始する</button>
  </div>
</div>

<div id="resultScreen" class="overlay-screen" style="display:none;">
  <div class="modal-card" style="max-width
